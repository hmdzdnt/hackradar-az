name = "hackradar-az-api"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "http://localhost:5173"
GEMINI_ENABLED = "false"
GEMINI_MODEL = "gemini-2.5-flash-lite"

[[durable_objects.bindings]]
name = "QUOTAS"
class_name = "Quotas"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quotas"]

[observability]
enabled = false
